[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning

# Run logical-issue tests separately if you want a green CI:
#   pytest --ignore=tests/test_logical_issues.py --ignore=tests/test_usage_critical_audit2.py --ignore=tests/test_operator_critical_usage.py --ignore=tests/test_app_review_operator_gaps.py --ignore=tests/test_remaining_critical_proofs.py
# Those tests document real bugs and are expected to FAIL until fixed.
