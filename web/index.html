<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yaver</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("yaver.theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      html, body {
        background-color: #07090d;
        background-image:
          linear-gradient(rgba(61, 255, 176, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(61, 255, 176, 0.035) 1px, transparent 1px);
        background-size: 28px 28px;
        color: #e8eef6; margin: 0; min-height: 100%;
      }
      #root { min-height: 100vh; }
      .vd-boot {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 2.5rem 1rem; box-sizing: border-box; position: relative; overflow: hidden;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      .vd-boot-card {
        position: relative; width: 100%; max-width: 400px; overflow: hidden;
        border: 1px solid #34506a;
        background: #101820;
        box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      }
      .vd-boot-bar { height: 2px; background: #3dffb0; }
      .vd-boot-body { padding: 1.75rem 2rem 2rem; }
      .vd-boot-mark {
        width: 64px; height: 64px; display: block;
        background: #11182c; border: 1px solid #34506a;
        box-shadow: inset 0 0 0 1px rgba(61, 255, 176, 0.18);
      }
      .vd-boot-kicker { font-size: 11px; letter-spacing: 0.08em; color: #3dffb0; }
      .vd-boot-kicker::before { content: "// "; color: #8aa0b5; }
      .vd-boot-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
      .vd-boot-blurb { margin: 8px 0 0; font-size: 14px; color: #a9bdd0; }
      .vd-boot-row {
        margin-top: 1.5rem; display: flex; align-items: center; gap: 12px;
        border: 1px solid #1e2c3d; padding: 12px 14px;
        background: #07090d;
      }
      .vd-boot-spin {
        width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
        border: 2px solid #3dffb0; border-right-color: transparent;
        animation: vd-boot-spin 0.65s linear infinite;
      }
      .vd-boot-status { font-size: 14px; font-weight: 500; }
      .vd-boot-hint { font-size: 12px; color: #8aa0b5; margin-top: 2px; }
      @keyframes vd-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .vd-boot-spin { animation: none; }
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f3f6f4;
        color: #122018;
        background-image:
          linear-gradient(rgba(12, 122, 72, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(12, 122, 72, 0.06) 1px, transparent 1px);
      }
      html[data-theme="light"] .vd-boot-card {
        border-color: #7f9d8e;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(18, 32, 24, 0.12);
      }
      html[data-theme="light"] .vd-boot-bar { background: #0c7a48; }
      html[data-theme="light"] .vd-boot-kicker { color: #085c36; }
      html[data-theme="light"] .vd-boot-kicker::before { color: #3c5548; }
      html[data-theme="light"] .vd-boot-blurb { color: #24382d; }
      html[data-theme="light"] .vd-boot-row {
        border-color: #d5e2db;
        background: #f3f6f4;
      }
      html[data-theme="light"] .vd-boot-spin {
        border-color: #0c7a48;
        border-right-color: transparent;
      }
      html[data-theme="light"] .vd-boot-hint { color: #3c5548; }
      html[data-theme="light"] .vd-boot-mark {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vd-boot">
        <div class="vd-boot-card">
          <div class="vd-boot-bar"></div>
          <div class="vd-boot-body">
            <div style="display:flex;align-items:center;gap:10px">
              <img class="vd-boot-mark" src="/yaver-wink.gif?v=2" alt="" width="64" height="64" />
              <div>
                <div class="vd-boot-kicker">Yaver</div>
                <div class="vd-boot-title">Ops console</div>
              </div>
            </div>
            <p class="vd-boot-blurb">Checking this session.</p>
            <div class="vd-boot-row">
              <span class="vd-boot-spin" aria-hidden="true"></span>
              <div>
                <div class="vd-boot-status">Opening console</div>
                <div class="vd-boot-hint">One moment</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
