# Freeze Yaver into standalone Windows / Linux executables (PyInstaller onedir).
# Additive to windows-dist.yml / linux-dist.yml — does not replace the offline zips.
#
# Config: packaging/pyinstaller/versions.env + yaver.spec
# Users: extract artifact → copy .env.example to .env → yaver start

name: Standalone Executables

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dist_suffix:
        description: "Optional SemVer-safe suffix for non-release builds"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  freeze:
    name: Freeze ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            platform: windows
            product: yaver-windows-x64
            ubuntu: ""
            glibc_max: ""
          # Each Linux freeze runs inside ubuntu:X.YY so collected libs
          # match that glibc. Host is ubuntu-22.04 (checkout / Node / SPA).
          # Do not freeze Linux on the runner itself — ubuntu-latest is
          # 24.04 and the binary then needs GLIBC_2.38 on older hosts.
          - os: ubuntu-22.04
            label: Linux x64 Ubuntu 18.04
            platform: linux
            product: yaver-linux-x64-ubuntu-18.04
            ubuntu: "18.04"
            glibc_max: "2.27"
          - os: ubuntu-22.04
            label: Linux x64 Ubuntu 20.04
            platform: linux
            product: yaver-linux-x64-ubuntu-20.04
            ubuntu: "20.04"
            glibc_max: "2.31"
          - os: ubuntu-22.04
            label: Linux x64 Ubuntu 22.04
            platform: linux
            product: yaver-linux-x64-ubuntu-22.04
            ubuntu: "22.04"
            glibc_max: "2.35"
          - os: ubuntu-22.04
            label: Linux x64 Ubuntu 24.04
            platform: linux
            product: yaver-linux-x64-ubuntu-24.04
            ubuntu: "24.04"
            glibc_max: "2.39"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load freeze versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(echo "$line" | tr -d '\r')"
            [ -z "${line// }" ] && continue
            key="${line%%=*}"
            val="${line#*=}"
            case "$key" in
              PYTHON_VERSION|NODE_VERSION|PYINSTALLER_VERSION|PYINSTALLER_MODE|PYTHON_STANDALONE_RELEASE|PYTHON_STANDALONE_ASSET|PYTHON_STANDALONE_SHA256)
                echo "$key=$val" >> "$GITHUB_OUTPUT"
                echo "$key=$val"
                ;;
            esac
          done < packaging/pyinstaller/versions.env
          for k in PYTHON_VERSION NODE_VERSION PYINSTALLER_VERSION; do
            if ! grep -q "^${k}=" "$GITHUB_OUTPUT"; then
              echo "Missing $k in packaging/pyinstaller/versions.env"
              exit 1
            fi
          done
          if [ "${{ matrix.platform }}" = "linux" ]; then
            for k in PYTHON_STANDALONE_RELEASE PYTHON_STANDALONE_ASSET PYTHON_STANDALONE_SHA256; do
              if ! grep -q "^${k}=" "$GITHUB_OUTPUT"; then
                echo "Missing $k in packaging/pyinstaller/versions.env"
                exit 1
              fi
            done
          fi

      - name: Resolve product version (Windows)
        if: runner.os == 'Windows'
        id: meta_win
        shell: pwsh
        run: |
          & .\packaging\windows\resolve-version.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -DistSuffix "${{ github.event.inputs.dist_suffix }}" `
            -ProductName "${{ matrix.product }}"

      - name: Resolve product version (Linux)
        if: runner.os != 'Windows'
        id: meta_linux
        run: |
          chmod +x packaging/linux/resolve-version.sh
          ./packaging/linux/resolve-version.sh \
            "${{ github.workspace }}" \
            "${{ matrix.product }}" \
            "${{ github.event.inputs.dist_suffix }}"

      - name: Version outputs
        id: meta
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "version=${{ steps.meta_win.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_safe=${{ steps.meta_win.outputs.version_safe }}" >> "$GITHUB_OUTPUT"
            echo "dist_name=${{ steps.meta_win.outputs.dist_name }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ steps.meta_win.outputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "base_version=${{ steps.meta_win.outputs.base_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.meta_linux.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_safe=${{ steps.meta_linux.outputs.version_safe }}" >> "$GITHUB_OUTPUT"
            echo "dist_name=${{ steps.meta_linux.outputs.dist_name }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ steps.meta_linux.outputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "base_version=${{ steps.meta_linux.outputs.base_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}

      - name: Snapshot OpenCoderman pin
        id: ocm
        shell: bash
        run: |
          mkdir -p dist
          python packaging/opencoderman_pin.py \
            --repo-root "${{ github.workspace }}" \
            --write-pin dist/opencoderman.pin \
            --zip dist \
            --compose-notes packaging/RELEASE_NOTES.md \
            --out-notes dist/RELEASE_NOTES.md \
            --github-output

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}

      - name: Build ops dashboard SPA
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          # SPA is display-only; no secrets in the bundle.
          CI: true

      - name: Install Python deps + PyInstaller
        if: matrix.platform == 'windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==${{ steps.versions.outputs.PYINSTALLER_VERSION }}"

      - name: Freeze executable (Windows)
        if: matrix.platform == 'windows'
        env:
          VD_PRODUCT_VERSION: ${{ steps.meta.outputs.version }}
          VD_DIST_NAME: ${{ steps.meta.outputs.dist_name }}
        run: python packaging/pyinstaller/build.py --clean --out-dir dist --dist-name "${{ steps.meta.outputs.dist_name }}"

      - name: Download standalone CPython (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          asset="${{ steps.versions.outputs.PYTHON_STANDALONE_ASSET }}"
          sha="${{ steps.versions.outputs.PYTHON_STANDALONE_SHA256 }}"
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${{ steps.versions.outputs.PYTHON_STANDALONE_RELEASE }}/${asset}"
          mkdir -p "$HOME/.cache/yaver-python"
          dest="$HOME/.cache/yaver-python/python.tar.gz"
          curl -fsSL -o "$dest" "$url"
          echo "${sha}  ${dest}" | sha256sum -c -

      - name: Freeze executable (Linux Ubuntu container)
        if: matrix.platform == 'linux'
        env:
          VD_PRODUCT_VERSION: ${{ steps.meta.outputs.version }}
          VD_DIST_NAME: ${{ steps.meta.outputs.dist_name }}
          PYINSTALLER_VERSION: ${{ steps.versions.outputs.PYINSTALLER_VERSION }}
        run: |
          set -euo pipefail
          chmod +x packaging/pyinstaller/freeze-in-ubuntu.sh
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "$HOME/.cache/yaver-python/python.tar.gz:/opt/python.tar.gz:ro" \
            -w /src \
            -e VD_PRODUCT_VERSION \
            -e VD_DIST_NAME \
            -e PYINSTALLER_VERSION \
            "ubuntu:${{ matrix.ubuntu }}" \
            bash packaging/pyinstaller/freeze-in-ubuntu.sh

      - name: Assert payload layout
        run: python packaging/pyinstaller/assert_payload.py "dist/stage/${{ steps.meta.outputs.dist_name }}" --platform "${{ matrix.platform }}"

      - name: Assert Linux glibc ceiling
        if: matrix.platform == 'linux'
        run: >
          python packaging/pyinstaller/assert_payload.py
          "dist/stage/${{ steps.meta.outputs.dist_name }}"
          --platform linux
          --max-glibc ${{ matrix.glibc_max }}
          --require-glibc-check

      - name: Smoke --help and --version
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/stage/${{ steps.meta.outputs.dist_name }}/yaver.exe"
          "$exe" --version
          "$exe" --help

      - name: Smoke --help and --version (Linux container)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          payload="${{ github.workspace }}/dist/stage/${{ steps.meta.outputs.dist_name }}"
          chmod +x "$payload/yaver"
          docker run --rm \
            -v "${payload}:/app:ro" \
            "ubuntu:${{ matrix.ubuntu }}" \
            /app/yaver --version
          docker run --rm \
            -v "${payload}:/app:ro" \
            "ubuntu:${{ matrix.ubuntu }}" \
            /app/yaver --help

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}
          path: dist/stage/${{ steps.meta.outputs.dist_name }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload zip archive
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}-zip
          path: dist/${{ steps.meta.outputs.dist_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload tar.gz archive (Linux)
        if: matrix.platform == 'linux' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}-tar
          path: dist/${{ steps.meta.outputs.dist_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Standalone executable (${{ matrix.label }})"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Product version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Channel | \`${{ steps.meta.outputs.channel }}\` |"
            echo "| Dist name | \`${{ steps.meta.outputs.dist_name }}\` |"
            echo "| PyInstaller | \`${{ steps.versions.outputs.PYINSTALLER_VERSION }}\` |"
            echo "| Ubuntu target | \`${{ matrix.ubuntu || 'n/a' }}\` |"
            echo "| Layout | onedir |"
            echo ""
            echo "Extract the artifact, copy \`.env.example\` to \`.env\`, run \`yaver start\`."
            echo "OpenCode / Codex are **not** inside this binary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yaver ${{ steps.meta.outputs.base_version }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ steps.meta.outputs.dist_name }}.zip
            dist/${{ steps.meta.outputs.dist_name }}.tar.gz
            dist/opencoderman-*.zip
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
