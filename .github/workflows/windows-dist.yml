# Build a Windows offline distribution zip with SemVer product versioning:
#   - VERSION file at repo root (MAJOR.MINOR.PATCH)
#   - develop push  → virtual_developer-windows-x64-X.Y.Z-dev.YYYYMMDD.N.gSHA
#   - main push     → virtual_developer-windows-x64-X.Y.Z.gSHA
#   - tag vX.Y.Z    → virtual_developer-windows-x64-X.Y.Z + GitHub Release
#
# Users: download artifact/zip → extract once → run install.bat
# OpenCode install target: %USERPROFILE%\.opencode (+ start-opencode.bat launcher)

name: Windows Distribution

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dist_suffix:
        description: "Optional SemVer-safe suffix for non-release builds (e.g. beta)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64 zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load pinned dependency versions
        id: versions
        shell: pwsh
        run: |
          $map = @{}
          Get-Content packaging/windows/versions.env | ForEach-Object {
            $line = $_.Trim()
            if (-not $line -or $line.StartsWith("#")) { return }
            $p = $line -split "=", 2
            if ($p.Count -eq 2) { $map[$p[0].Trim()] = $p[1].Trim() }
          }
          foreach ($k in @("OPENCODE_VERSION","OH_MY_OPENCODE_VERSION","GLAB_VERSION","PYTHON_VERSION","NODE_VERSION","NODE_FULL_VERSION")) {
            if (-not $map.ContainsKey($k) -or -not $map[$k]) {
              throw "Missing $k in packaging/windows/versions.env"
            }
            Write-Host "$k=$($map[$k])"
            "$k=$($map[$k])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $minPy = if ($map["PYTHON_MIN_VERSION"]) { $map["PYTHON_MIN_VERSION"] } else { "3.10" }
          $wheelPy = if ($map["PYTHON_WHEEL_VERSIONS"]) { $map["PYTHON_WHEEL_VERSIONS"] } else { "3.10,3.11,3.12,3.13" }
          "PYTHON_MIN_VERSION=$minPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PYTHON_WHEEL_VERSIONS=$wheelPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PYTHON_MIN_VERSION=$minPy"
          Write-Host "PYTHON_WHEEL_VERSIONS=$wheelPy"

      - name: Resolve product version (SemVer)
        id: meta
        shell: pwsh
        run: |
          & .\packaging\windows\resolve-version.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -DistSuffix "${{ github.event.inputs.dist_suffix }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}

      - name: Build distribution
        id: build
        shell: pwsh
        env:
          VD_PRODUCT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & .\packaging\windows\build-dist.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -OutDir "${{ github.workspace }}\dist" `
            -DistName "${{ steps.meta.outputs.dist_name }}"

      # Fast payload assertions only (full install.bat e2e-smoke removed — too slow for CI)
      - name: Assert payload layout
        shell: pwsh
        run: |
          $p = "dist/stage/${{ steps.meta.outputs.dist_name }}"
          foreach ($rel in @(
            "install.bat",
            "install-dashboard.bat",
            "install-opencode-online.bat",
            "start.bat",
            "start-backend.bat",
            "start-frontend.bat",
            "start-opencode-serve.bat",
            "cli.py",
            "src/daemon.py",
            "web/dist/index.html",
            "vendor/opencode-home.zip",
            "vendor/python-wheels",
            "vendor/node/node.exe",
            "vendor/node/npm.cmd",
            "vendor/npm-online.npmrc",
            "vendor/online-sources.env",
            "packaging/windows/Install-OpencodeOnline.ps1",
            "packaging/windows/npm-online.npmrc",
            "packaging/windows/Stop-VdProcesses.ps1",
            "packaging/windows/Wait-Http.ps1",
            "packaging/windows/serve_frontend.py"
          )) {
            $path = Join-Path $p $rel
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required payload path: $rel"
            }
            Write-Host "OK $rel"
          }
          if (Test-Path -LiteralPath (Join-Path $p "web/node_modules")) {
            throw "web/node_modules must not be in the offline zip"
          }
          if (Test-Path -LiteralPath (Join-Path $p "vendor/opencode-home/node_modules")) {
            throw "expanded vendor/opencode-home/node_modules must not be in the zip"
          }
          $spa = Join-Path $p "web/dist"
          $js = @(Get-ChildItem -LiteralPath (Join-Path $spa "assets") -Filter "index-*.js" -File -ErrorAction SilentlyContinue)
          $css = @(Get-ChildItem -LiteralPath (Join-Path $spa "assets") -Filter "index-*.css" -File -ErrorAction SilentlyContinue)
          if ($js.Count -lt 1) { throw "web/dist/assets/index-*.js missing (SPA not built)" }
          if ($css.Count -lt 1) { throw "web/dist/assets/index-*.css missing (SPA not built)" }
          $jsText = Get-Content -LiteralPath $js[0].FullName -Raw -ErrorAction Stop
          foreach ($needle in @(
              "agent_task_max_retries",
              "agent_task_max_incomplete_retries",
              "opencode_serve_max_compact_continues"
            )) {
            if ($jsText -notmatch [regex]::Escape($needle)) {
              throw "Stale dashboard SPA: '$needle' not in $($js[0].Name)"
            }
            Write-Host "OK SPA contains $needle"
          }
          Write-Host "OK SPA bundle $($js[0].Name) + $($css[0].Name)"
          Write-Host "Payload layout OK (no full install smoke)"

      # Folder upload: one extract → install.bat at top level
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}
          path: dist/stage/${{ steps.meta.outputs.dist_name }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # Also keep the single .zip for Releases / direct download naming
      - name: Upload zip artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}-zip
          path: dist/${{ steps.meta.outputs.dist_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload dashboard SPA (web/dist only)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-dist
          path: dist/stage/${{ steps.meta.outputs.dist_name }}/web/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          $zip = "dist/${{ steps.meta.outputs.dist_name }}.zip"
          $size = if (Test-Path $zip) { "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB) } else { "n/a" }
          @"
          ## Windows dist built

          | Field | Value |
          |-------|-------|
          | Product version | ``${{ steps.meta.outputs.version }}`` |
          | Channel | ``${{ steps.meta.outputs.channel }}`` |
          | Dist name | ``${{ steps.meta.outputs.dist_name }}`` |
          | Zip size | $size |
          | OpenCode | ``${{ steps.versions.outputs.OPENCODE_VERSION }}`` |
          | oh-my-openagent | ``${{ steps.versions.outputs.OH_MY_OPENCODE_VERSION }}`` |
          | glab | ``${{ steps.versions.outputs.GLAB_VERSION }}`` |

          Download the **Actions artifact** named after the dist, extract once, run ``install.bat``,
          then start the product with ``start.bat`` (backend + ops dashboard on http://127.0.0.1:8080).
          Dashboard UI only: download the **dashboard-web-dist** artifact (``web/dist``) and copy it
          over ``web\\dist`` on an existing install, then restart the backend.
          Optional TUI: ``start-opencode.bat`` (never from your user home folder).
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Virtual Developer ${{ steps.meta.outputs.version }}
          files: dist/${{ steps.meta.outputs.dist_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Windows offline installer `${{ steps.meta.outputs.version }}`

            1. Download **`${{ steps.meta.outputs.dist_name }}.zip`**
            2. Extract once — you should see `install.bat`, `start.bat`, `START_HERE.txt`, `VERSION`, `vendor\`, `src\`, `web\dist\`
            3. Install a **supported** Python (see `vendor\SUPPORTED_PYTHON.txt`)
            4. Run **`install.bat`** (venv + offline wheels + OpenCode home)
            5. Edit **`.env`**, then run **`start.bat`**
               - Stops any previous instance, starts daemon + ops dashboard
               - Open **http://127.0.0.1:8080**
            6. Optional TUI: **`start-opencode.bat`** (from the project folder only)

            ### Product / bundled versions
            - **Product:** `${{ steps.meta.outputs.version }}` (base `${{ steps.meta.outputs.base_version }}`)
            - OpenCode: `${{ steps.versions.outputs.OPENCODE_VERSION }}`
            - oh-my-openagent: `${{ steps.versions.outputs.OH_MY_OPENCODE_VERSION }}`
            - glab: `${{ steps.versions.outputs.GLAB_VERSION }}`
            - Python wheels: `${{ steps.versions.outputs.PYTHON_WHEEL_VERSIONS }}`
            - Ops dashboard SPA: prebuilt `web\dist` (Node not required at runtime)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
