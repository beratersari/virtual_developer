# Build a Windows offline distribution zip with SemVer product versioning:
#   - VERSION file at repo root (MAJOR.MINOR.PATCH)
#   - develop push  → virtual_developer-windows-x64-X.Y.Z-dev.YYYYMMDD.N.gSHA
#   - main push     → virtual_developer-windows-x64-X.Y.Z.gSHA
#   - tag vX.Y.Z    → virtual_developer-windows-x64-X.Y.Z + GitHub Release
#
# Users: download artifact/zip → extract once →
#   install-dashboard.bat  (Python .venv + SPA launchers)
#   install-backends.bat   (OpenCode; also installs Codex unless split)
#   install-codex.bat      (Codex CLI only)
# Do not ship a combined install.bat.

name: Windows Distribution

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dist_suffix:
        description: "Optional SemVer-safe suffix for non-release builds (e.g. beta)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64 zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Runner Defender quarantines opencode.exe (21-byte stub) after the PE
      # check, then Assert payload layout fails on
      # opencoderman/vendor/bin/windows/opencode.exe. Same as e2e-smoke.ps1.
      - name: Defender exclusions for opencode.exe
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host "realtime monitoring disabled"
          } catch {
            Write-Host "could not disable realtime: $($_.Exception.Message)"
          }
          foreach ($ep in @(
              "${{ github.workspace }}",
              "${{ github.workspace }}\dist",
              (Join-Path $env:TEMP "vd-oc-home")
            )) {
            try {
              Add-MpPreference -ExclusionPath $ep -ErrorAction Stop
              Write-Host "exclusion: $ep"
            } catch {
              Write-Host "skip exclusion $ep : $($_.Exception.Message)"
            }
          }
          try {
            Add-MpPreference -ExclusionProcess "opencode.exe" -ErrorAction Stop
            Write-Host "exclusion process: opencode.exe"
          } catch {
            Write-Host "skip process exclusion: $($_.Exception.Message)"
          }

      - name: Load pinned dependency versions
        id: versions
        shell: pwsh
        run: |
          $map = @{}
          Get-Content packaging/windows/versions.env | ForEach-Object {
            $line = $_.Trim()
            if (-not $line -or $line.StartsWith("#")) { return }
            $p = $line -split "=", 2
            if ($p.Count -eq 2) { $map[$p[0].Trim()] = $p[1].Trim() }
          }
          foreach ($k in @("OPENCODE_VERSION","OH_MY_OPENCODE_VERSION","GLAB_VERSION","CODEX_VERSION","PYTHON_VERSION","NODE_VERSION","NODE_FULL_VERSION")) {
            if (-not $map.ContainsKey($k) -or -not $map[$k]) {
              throw "Missing $k in packaging/windows/versions.env"
            }
            Write-Host "$k=$($map[$k])"
            "$k=$($map[$k])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $minPy = if ($map["PYTHON_MIN_VERSION"]) { $map["PYTHON_MIN_VERSION"] } else { "3.10" }
          $wheelPy = if ($map["PYTHON_WHEEL_VERSIONS"]) { $map["PYTHON_WHEEL_VERSIONS"] } else { "3.10,3.11,3.12,3.13" }
          "PYTHON_MIN_VERSION=$minPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PYTHON_WHEEL_VERSIONS=$wheelPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PYTHON_MIN_VERSION=$minPy"
          Write-Host "PYTHON_WHEEL_VERSIONS=$wheelPy"

      - name: Resolve product version (SemVer)
        id: meta
        shell: pwsh
        run: |
          & .\packaging\windows\resolve-version.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -DistSuffix "${{ github.event.inputs.dist_suffix }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}

      - name: Snapshot OpenCoderman pin
        id: ocm
        shell: bash
        run: |
          mkdir -p dist
          python packaging/opencoderman_pin.py \
            --repo-root "${{ github.workspace }}" \
            --write-pin dist/opencoderman.pin \
            --zip dist \
            --compose-notes packaging/RELEASE_NOTES.md \
            --out-notes dist/RELEASE_NOTES.md \
            --github-output

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}

      - name: Build distribution
        id: build
        shell: pwsh
        env:
          VD_PRODUCT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & .\packaging\windows\build-dist.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -OutDir "${{ github.workspace }}\dist" `
            -DistName "${{ steps.meta.outputs.dist_name }}"

      # Fast payload assertions only (full e2e-smoke install is too slow for CI)
      - name: Assert payload layout
        shell: pwsh
        run: |
          & .\packaging\windows\assert-payload.ps1 `
            -PayloadDir "dist/stage/${{ steps.meta.outputs.dist_name }}"

      # Folder upload: one extract → install.bat at top level
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}
          path: dist/stage/${{ steps.meta.outputs.dist_name }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # Also keep the single .zip for Releases / direct download naming
      - name: Upload zip artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}-zip
          path: dist/${{ steps.meta.outputs.dist_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload CLI offline zip
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.clis_name }}
          path: ${{ steps.build.outputs.clis_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          $zip = "dist/${{ steps.meta.outputs.dist_name }}.zip"
          $size = if (Test-Path $zip) { "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB) } else { "n/a" }
          @"
          ## Windows dist built

          | Field | Value |
          |-------|-------|
          | Product version | ``${{ steps.meta.outputs.version }}`` |
          | Channel | ``${{ steps.meta.outputs.channel }}`` |
          | Dist name | ``${{ steps.meta.outputs.dist_name }}`` |
          | Zip size | $size |
          | OpenCode | ``${{ steps.versions.outputs.OPENCODE_VERSION }}`` |
          | OpenCode agents | stock ``build`` / ``plan`` (no oh-my-openagent) |
          | glab | ``${{ steps.versions.outputs.GLAB_VERSION }}`` |
          | Codex | ``${{ steps.versions.outputs.CODEX_VERSION }}`` |

          Download the **Actions artifact** named after the dist (includes prebuilt ``web/dist``),
          extract once, run ``install.bat``, then start with ``start.bat``
          (backend + ops dashboard on http://127.0.0.1:8080).
          Optional TUI: ``start-opencode.bat`` (never from your user home folder).
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yaver ${{ steps.meta.outputs.base_version }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ steps.meta.outputs.dist_name }}.zip
            dist/opencoderman-*.zip
            dist/yaver-clis-windows-x64-*.zip
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
