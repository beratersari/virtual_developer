# Build a Windows offline distribution zip:
#   - OpenCode CLI (pinned) + config template for %USERPROFILE%\.opencode
#   - oh-my-opencode plugin (pinned, preinstalled node_modules)
#   - glab CLI (pinned)
#   - Python wheels for requirements.txt (offline pip)
#   - Application sources + install.bat
#
# Users: download zip -> extract -> run install.bat

name: Windows Distribution

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dist_suffix:
        description: "Optional suffix for the zip name (e.g. beta)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64 zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned versions
        id: versions
        shell: pwsh
        run: |
          $map = @{}
          Get-Content packaging/windows/versions.env | ForEach-Object {
            $line = $_.Trim()
            if (-not $line -or $line.StartsWith("#")) { return }
            $p = $line -split "=", 2
            if ($p.Count -eq 2) { $map[$p[0].Trim()] = $p[1].Trim() }
          }
          foreach ($k in @("OPENCODE_VERSION","OH_MY_OPENCODE_VERSION","GLAB_VERSION","PYTHON_VERSION","NODE_VERSION")) {
            if (-not $map.ContainsKey($k) -or -not $map[$k]) {
              throw "Missing $k in packaging/windows/versions.env"
            }
            Write-Host "$k=$($map[$k])"
            "$k=$($map[$k])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $minPy = if ($map["PYTHON_MIN_VERSION"]) { $map["PYTHON_MIN_VERSION"] } else { "3.10" }
          $wheelPy = if ($map["PYTHON_WHEEL_VERSIONS"]) { $map["PYTHON_WHEEL_VERSIONS"] } else { "3.10,3.11,3.12,3.13" }
          "PYTHON_MIN_VERSION=$minPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PYTHON_WHEEL_VERSIONS=$wheelPy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PYTHON_MIN_VERSION=$minPy"
          Write-Host "PYTHON_WHEEL_VERSIONS=$wheelPy"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.NODE_VERSION }}

      - name: Resolve dist name
        id: meta
        shell: pwsh
        run: |
          $suffix = "${{ github.event.inputs.dist_suffix }}"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $sha = $env:GITHUB_SHA.Substring(0, 7)
            $ver = "dev-$sha"
          }
          $name = "virtual_developer-windows-x64-$ver"
          if ($suffix) { $name = "$name-$suffix" }
          Write-Host "dist_name=$name"
          "dist_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build distribution
        id: build
        shell: pwsh
        run: |
          & .\packaging\windows\build-dist.ps1 `
            -RepoRoot "${{ github.workspace }}" `
            -OutDir "${{ github.workspace }}\dist" `
            -DistName "${{ steps.meta.outputs.dist_name }}"

      # Platform gate: packaging green is not enough — prove extract+install on Windows.
      - name: E2E smoke (deep path + install.bat + opencode --version)
        shell: pwsh
        run: |
          & .\packaging\windows\e2e-smoke.ps1 `
            -PayloadDir "${{ github.workspace }}\dist\stage\${{ steps.meta.outputs.dist_name }}"

      # Upload the FOLDER (not a .zip inside a .zip). GitHub still wraps one
      # download archive; after extract you get install.bat at the top level.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.dist_name }}
          path: dist/stage/${{ steps.meta.outputs.dist_name }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.dist_name }}.zip
          generate_release_notes: true
          body: |
            ## Windows offline installer

            1. Download the zip (single archive — extract once)
            2. You should see `install.bat`, `START_HERE.txt`, `vendor\`, `src\`
            3. Install a **supported** Python (see `vendor\SUPPORTED_PYTHON.txt` inside the package)
            4. Run **`install.bat`**

            ### Bundled versions
            - OpenCode: `${{ steps.versions.outputs.OPENCODE_VERSION }}`
            - oh-my-opencode: `${{ steps.versions.outputs.OH_MY_OPENCODE_VERSION }}`
            - glab: `${{ steps.versions.outputs.GLAB_VERSION }}`
            - Python wheels attempted for: `${{ steps.versions.outputs.PYTHON_WHEEL_VERSIONS }}`

            No npm/Node required. Do not use Python versions newer than the supported list
            (e.g. 3.14 often lacks `pydantic-core` wheels).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
